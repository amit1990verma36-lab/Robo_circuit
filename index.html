<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArmCar 1-to-1 Wire Diagram</title>
<style>
  body { margin: 0; background: #080d1a; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 10px; }
  .box { max-width: 1200px; margin: auto; overflow-x: auto; background: #0f172a; border-radius: 16px; padding: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  svg { width: 100%; min-width: 1000px; height: auto; }
</style>
</head>
<body>
<h2>ArmCar 1-to-1 Full Wire Diagram</h2>
<p style="font-size: 13px; color: #94a3b8;">Zoom karke ek-ek pin aur taar ko aasaani se dekhein</p>
<div class="box">
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ================= MODULES ================= -->
  <!-- Battery -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="160" height="90" rx="8" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/>
    <text x="120" y="75" fill="#fff" font-weight="bold" font-size="16" text-anchor="middle">BATTERY</text>
    <text x="120" y="95" fill="#fee2e2" font-size="12" text-anchor="middle">7.4V - 12V Li-ion</text>
    <circle cx="180" cy="60" r="6" fill="#ef4444" stroke="#fff" stroke-width="2"/>
    <text x="165" y="64" fill="#fff" font-size="11" font-weight="bold">(+)</text>
    <circle cx="180" cy="100" r="6" fill="#111827" stroke="#fff" stroke-width="2"/>
    <text x="167" y="104" fill="#fff" font-size="11" font-weight="bold">(-)</text>
  </g>

  <!-- Buck Converter -->
  <g filter="url(#shadow)">
    <rect x="300" y="30" width="220" height="130" rx="8" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
    <text x="410" y="60" fill="#fff" font-weight="bold" font-size="15" text-anchor="middle">BUCK CONVERTER</text>
    <text x="410" y="80" fill="#bfdbfe" font-size="12" text-anchor="middle">(XL4015 Set to 5.0V)</text>
    <!-- In pins -->
    <circle cx="310" cy="105" r="5" fill="#ef4444"/><text x="325" y="109" fill="#fff" font-size="11">IN (+)</text>
    <circle cx="310" cy="135" r="5" fill="#111827" stroke="#fff"/><text x="325" y="139" fill="#fff" font-size="11">IN (-)</text>
    <!-- Out pins -->
    <circle cx="510" cy="105" r="5" fill="#ef4444"/><text x="460" y="109" fill="#fff" font-size="11">OUT (+)</text>
    <circle cx="510" cy="135" r="5" fill="#111827" stroke="#fff"/><text x="460" y="139" fill="#fff" font-size="11">OUT (-)</text>
  </g>

  <!-- Capacitor -->
  <g filter="url(#shadow)">
    <rect x="610" y="50" width="130" height="80" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="675" y="80" fill="#fff" font-weight="bold" font-size="13" text-anchor="middle">CAPACITOR</text>
    <text x="675" y="100" fill="#cbd5e1" font-size="11" text-anchor="middle">1000µF 16V/25V</text>
    <circle cx="620" cy="115" r="5" fill="#ef4444"/><text x="630" y="119" fill="#fca5a5" font-size="11">(+)</text>
    <circle cx="730" cy="115" r="5" fill="#111827" stroke="#fff"/><text x="710" y="119" fill="#cbd5e1" font-size="11">(-)</text>
  </g>

  <!-- L298N Motor Driver -->
  <g filter="url(#shadow)">
    <rect x="40" y="260" width="260" height="270" rx="8" fill="#881337" stroke="#f43f5e" stroke-width="2"/>
    <text x="170" y="290" fill="#fff" font-weight="bold" font-size="17" text-anchor="middle">L298N DRIVER</text>
    <!-- Power screw terminals -->
    <rect x="50" y="310" width="110" height="40" fill="#be123c" rx="4"/>
    <circle cx="65" cy="330" r="5" fill="#ef4444"/><text x="75" y="334" fill="#fff" font-size="11">12V Pin</text>
    <circle cx="125" cy="330" r="5" fill="#111827" stroke="#fff"/><text x="135" y="334" fill="#fff" font-size="11">GND</text>
    <!-- Logic input pins -->
    <circle cx="285" cy="380" r="5" fill="#38bdf8"/><text x="245" y="384" fill="#fff" font-size="12">IN1</text>
    <circle cx="285" cy="410" r="5" fill="#06b6d4"/><text x="245" y="414" fill="#fff" font-size="12">IN2</text>
    <circle cx="285" cy="440" r="5" fill="#f97316"/><text x="245" y="444" fill="#fff" font-size="12">IN3</text>
    <circle cx="285" cy="470" r="5" fill="#eab308"/><text x="245" y="474" fill="#fff" font-size="12">IN4</text>
    <!-- Motor Outs -->
    <text x="70" y="480" fill="#fde047" font-size="12">OUT1,2 ➔ Left Motors</text>
    <text x="70" y="505" fill="#fde047" font-size="12">OUT3,4 ➔ Right Motors</text>
  </g>

  <!-- ESP32 Board -->
  <g filter="url(#shadow)">
    <rect x="460" y="250" width="280" height="370" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="600" y="285" fill="#fff" font-weight="bold" font-size="20" text-anchor="middle">ESP32 (30 PIN)</text>
    <!-- Left pins -->
    <circle cx="475" cy="320" r="5" fill="#ef4444"/><text x="490" y="324" fill="#fff" font-size="12">VIN (5V in)</text>
    <circle cx="475" cy="350" r="5" fill="#111827" stroke="#fff"/><text x="490" y="354" fill="#fff" font-size="12">GND</text>
    <circle cx="475" cy="380" r="5" fill="#38bdf8"/><text x="490" y="384" fill="#fff" font-size="12">GPIO 25 (M1_IN1)</text>
    <circle cx="475" cy="410" r="5" fill="#06b6d4"/><text x="490" y="414" fill="#fff" font-size="12">GPIO 26 (M1_IN2)</text>
    <circle cx="475" cy="440" r="5" fill="#f97316"/><text x="490" y="444" fill="#fff" font-size="12">GPIO 27 (M2_IN1)</text>
    <circle cx="475" cy="470" r="5" fill="#eab308"/><text x="490" y="474" fill="#fff" font-size="12">GPIO 14 (M2_IN2)</text>
    <circle cx="475" cy="510" r="5" fill="#a855f7"/><text x="490" y="514" fill="#fff" font-size="12">GPIO 32 (IR Left)</text>
    <circle cx="475" cy="540" r="5" fill="#e2e8f0"/><text x="490" y="544" fill="#fff" font-size="12">GPIO 33 (IR Right)</text>
    <circle cx="475" cy="570" r="5" fill="#ec4899"/><text x="490" y="574" fill="#fff" font-size="12">GPIO 4 (Dock Sw)</text>

    <!-- Right pins -->
    <circle cx="725" cy="320" r="5" fill="#f43f5e"/><text x="670" y="324" fill="#fff" font-size="12">3V3</text>
    <circle cx="725" cy="350" r="5" fill="#111827" stroke="#fff"/><text x="670" y="354" fill="#fff" font-size="12">GND</text>
    <circle cx="725" cy="400" r="5" fill="#22c55e"/><text x="635" y="404" fill="#fff" font-size="12">GPIO 21 (SDA)</text>
    <circle cx="725" cy="430" r="5" fill="#eab308"/><text x="635" y="434" fill="#fff" font-size="12">GPIO 22 (SCL)</text>
  </g>

  <!-- PCA9685 Servo Driver -->
  <g filter="url(#shadow)">
    <rect x="880" y="250" width="280" height="340" rx="8" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
    <text x="1020" y="285" fill="#fff" font-weight="bold" font-size="17" text-anchor="middle">PCA9685 (ARM)</text>
    <!-- Screw terminal for servo power -->
    <rect x="895" y="305" width="130" height="45" fill="#155e75" rx="4"/>
    <circle cx="915" cy="328" r="5" fill="#ef4444"/><text x="925" y="332" fill="#fff" font-size="12">V+ (Servos 5V)</text>
    <circle cx="1005" cy="328" r="5" fill="#111827" stroke="#fff"/><text x="975" y="332" fill="#fff" font-size="12">GND</text>
    <!-- I2C Logic pins -->
    <circle cx="895" cy="385" r="5" fill="#f43f5e"/><text x="910" y="389" fill="#fff" font-size="12">VCC (Logic 3.3V)</text>
    <circle cx="895" cy="415" r="5" fill="#111827" stroke="#fff"/><text x="910" y="419" fill="#fff" font-size="12">GND</text>
    <circle cx="895" cy="445" r="5" fill="#22c55e"/><text x="910" y="449" fill="#fff" font-size="12">SDA</text>
    <circle cx="895" cy="475" r="5" fill="#eab308"/><text x="910" y="479" fill="#fff" font-size="12">SCL</text>
    <!-- Servo Ports -->
    <text x="1020" y="525" fill="#fde047" font-weight="bold" font-size="13" text-anchor="middle">CH 0 ➔ Base Servo</text>
    <text x="1020" y="545" fill="#fde047" font-size="12" text-anchor="middle">CH 1: Shoulder | CH 2: Elbow</text>
    <text x="1020" y="565" fill="#fde047" font-size="12" text-anchor="middle">CH 3: Wrist | CH 4: Gripper</text>
  </g>

  <!-- IR Sensors bottom -->
  <g filter="url(#shadow)">
    <rect x="180" y="670" width="190" height="110" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="275" y="700" fill="#fff" font-weight="bold" font-size="14" text-anchor="middle">LEFT IR SENSOR</text>
    <circle cx="355" cy="730" r="5" fill="#a855f7"/><text x="315" y="734" fill="#fff" font-size="11">OUT</text>
    <circle cx="355" cy="755" r="5" fill="#ef4444"/><text x="315" y="759" fill="#fff" font-size="11">VCC</text>
    <circle cx="355" cy="775" r="5" fill="#111827" stroke="#fff"/><text x="315" y="779" fill="#fff" font-size="11">GND</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="670" width="190" height="110" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="535" y="700" fill="#fff" font-weight="bold" font-size="14" text-anchor="middle">RIGHT IR SENSOR</text>
    <circle cx="455" cy="730" r="5" fill="#e2e8f0"/><text x="470" y="734" fill="#fff" font-size="11">OUT</text>
    <circle cx="455" cy="755" r="5" fill="#ef4444"/><text x="470" y="759" fill="#fff" font-size="11">VCC</text>
    <circle cx="455" cy="775" r="5" fill="#111827" stroke="#fff"/><text x="470" y="779" fill="#fff" font-size="11">GND</text>
  </g>

  <!-- ================= WIRES (1-BY-1) ================= -->
  <!-- Battery (+) to L298N 12V and Buck IN+ -->
  <path d="M 180 60 L 220 60 L 220 105 L 305 105" stroke="#ef4444" stroke-width="3" fill="none"/>
  <path d="M 220 60 L 220 200 L 65 200 L 65 325" stroke="#ef4444" stroke-width="3" fill="none"/>
  <!-- Battery (-) to Buck IN- and L298N GND -->
  <path d="M 180 100 L 240 100 L 240 135 L 305 135" stroke="#0f172a" stroke-width="3" fill="none"/>
  <path d="M 240 100 L 240 220 L 125 220 L 125 325" stroke="#0f172a" stroke-width="3" fill="none"/>

  <!-- Buck OUT (+) to Capacitor and ESP32 VIN & PCA9685 V+ -->
  <path d="M 515 105 L 560 105 L 560 115 L 615 115" stroke="#ef4444" stroke-width="3" fill="none"/>
  <path d="M 560 105 L 560 200 L 440 200 L 440 320 L 470 320" stroke="#ef4444" stroke-width="3" fill="none"/>
  <path d="M 560 200 L 850 200 L 850 328 L 910 328" stroke="#ef4444" stroke-width="3.5" fill="none"/>

  <!-- Buck OUT (-) to Capacitor and Common GND -->
  <path d="M 515 135 L 580 135 L 580 115 L 725 115" stroke="#020617" stroke-width="3" stroke-dasharray="5,3" fill="none"/>
  <path d="M 580 135 L 580 230 L 420 230 L 420 350 L 470 350" stroke="#020617" stroke-width="3" stroke-dasharray="5,3" fill="none"/>
  <path d="M 580 230 L 870 230 L 870 328 L 1000 328" stroke="#020617" stroke-width="3" stroke-dasharray="5,3" fill="none"/>

  <!-- L298N IN1..4 to ESP32 -->
  <path d="M 290 380 L 470 380" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <path d="M 290 410 L 470 410" stroke="#06b6d4" stroke-width="2.5" fill="none"/>
  <path d="M 290 440 L 470 440" stroke="#f97316" stroke-width="2.5" fill="none"/>
  <path d="M 290 470 L 470 470" stroke="#eab308" stroke-width="2.5" fill="none"/>

  <!-- ESP32 to PCA9685 Logic (VCC 3.3V, GND, SDA 21, SCL 22) -->
  <path d="M 730 320 L 830 320 L 830 385 L 890 385" stroke="#f43f5e" stroke-width="2.5" fill="none"/>
  <path d="M 730 350 L 820 350 L 820 415 L 890 415" stroke="#020617" stroke-width="2.5" stroke-dasharray="5,3" fill="none"/>
  <path d="M 730 400 L 890 445" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  <path d="M 730 430 L 890 475" stroke="#eab308" stroke-width="2.5" fill="none"/>

  <!-- Left IR to ESP32 GPIO 32 -->
  <path d="M 360 730 L 410 730 L 410 510 L 470 510" stroke="#a855f7" stroke-width="2.5" fill="none"/>
  <!-- Right IR to ESP32 GPIO 33 -->
  <path d="M 450 730 L 430 730 L 430 540 L 470 540" stroke="#e2e8f0" stroke-width="2.5" fill="none"/>
</svg>
</div>
</body>
  </html>
